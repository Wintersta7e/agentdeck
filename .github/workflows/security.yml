name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays 06:00 UTC — re-scan against advisories published since the last push.
    - cron: '0 6 * * 1'

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

# No workflow-wide token: each job opts in to the scopes it needs.
permissions: {}

# Tools are installed from pinned first-party release binaries rather than
# marketplace actions: the trivy-action tags were hijacked in a March 2026
# supply-chain attack, so a security workflow should not trust mutable action
# refs. The same reasoning pins the first-party actions below to commit SHAs.
# Versions match the locally-run toolchain (`npm run security`).
jobs:
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so gitleaks can scan every commit
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan history for secrets (blocking)
        run: gitleaks git . --no-banner --redact --exit-code 1

  dependencies:
    name: Dependencies (osv-scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install osv-scanner
        run: |
          curl -sSL https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64 \
            -o /usr/local/bin/osv-scanner
          chmod +x /usr/local/bin/osv-scanner
      # Blocking at every severity, dev dependencies included: a build-time
      # compromise reaches the shipped .exe just as a runtime one does.
      - name: Scan dependencies for known CVEs (blocking)
        run: osv-scanner scan source -r .

  vulnerabilities:
    name: Vulns + secrets + misconfig (trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install trivy
        run: |
          curl -sSL https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz \
            | tar -xz -C /usr/local/bin trivy
      - name: Cache trivy vulnerability DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-
      - name: Scan filesystem — HIGH/CRITICAL block (blocking)
        run: |
          trivy fs --scanners vuln,secret \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --skip-dirs node_modules,dist,dist-release,out \
            --no-progress .
      - name: Misconfiguration scan (blocking)
        run: |
          trivy fs --scanners misconfig \
            --exit-code 1 \
            --skip-dirs node_modules,dist,dist-release,out \
            --no-progress .

  sast:
    name: Static analysis (semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The two excluded rules are inherently noisy for this codebase — it
      # legitimately joins validated IDs into paths (guarded by allowlist /
      # safeId) and compiles user-authored workflow-condition regexes — so they
      # fire only false positives here. See .semgrepignore for the rationale.
      #
      # ERROR severity blocks; WARNING/INFO run as a second, advisory pass.
      # `--config auto` resolves rules from the registry at scan time, so a
      # newly published ERROR rule can turn this red without a code change —
      # that is the intended trade-off, same as the osv-scanner job.
      - name: Install semgrep
        run: pipx install semgrep==1.177.0
      - name: Run semgrep — ERROR severity (blocking)
        run: |
          semgrep scan --config auto src/ --severity ERROR --error \
            --exclude-rule javascript.lang.security.audit.path-traversal.path-join-resolve-traversal.path-join-resolve-traversal \
            --exclude-rule javascript.lang.security.audit.detect-non-literal-regexp.detect-non-literal-regexp
      - name: Run semgrep — all severities (advisory)
        continue-on-error: true
        run: |
          semgrep scan --config auto src/ \
            --exclude-rule javascript.lang.security.audit.path-traversal.path-join-resolve-traversal.path-join-resolve-traversal \
            --exclude-rule javascript.lang.security.audit.detect-non-literal-regexp.detect-non-literal-regexp
